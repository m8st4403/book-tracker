<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本棚スケジュール v3</title>
<style>body{font-family:-apple-system,sans-serif;margin:0;background:#f5f5f7;color:#111}header{background:#fff;padding:16px;position:sticky;top:0}main{padding:12px;max-width:800px;margin:auto}.card{background:#fff;padding:15px;margin:10px 0;border-radius:16px}input,button{font:inherit}input{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:10px;background:#111;color:white;font-weight:bold}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#6b7280;font-size:13px}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}.book{display:flex;gap:12px}.cover{width:60px;height:86px;object-fit:cover;background:#eee;border-radius:7px}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;border-top:1px solid #ddd}nav button{flex:1;background:white;color:#555;border-radius:0;font-size:12px}section{display:none}section.active{display:block}#scanner{display:none;position:fixed;inset:0;background:#000;color:#fff;z-index:10;padding:15px}video{width:100%;height:70%;object-fit:cover;margin-top:35px;border-radius:15px}</style></head><body>
<header><b>📚 本棚スケジュール v3</b><div class="muted">ISBN検索改善版</div></header><main>
<section id="shelf" class="active"><div class="card"><b>本を追加</b><p class="muted">ISBN-10/13、ハイフン付き、全角数字に対応。</p><div class="row"><input id="isbn" inputmode="numeric" placeholder="978-4-09-861040-3"><button id="scan">📷 スキャン</button></div><button id="isbnSearch" style="width:100%;margin-top:8px">ISBNで検索</button><hr><div class="row"><input id="work" placeholder="作品タイトル"><input id="vol" inputmode="numeric" placeholder="巻数"></div><button id="workSearch" style="width:100%;margin-top:8px">作品＋巻数から検索</button><div id="addResults"></div></div><div class="card"><b>蔵書</b><div id="myBooks"></div></div></section>
<section id="search"><div class="card"><b>🔎 検索</b><div class="row"><input id="query" placeholder="作品名 / 作家名 / ISBN"><button id="searchBtn">検索</button></div></div><div id="searchResults"></div></section>
<section id="authors"><div class="card"><b>✍️ 作家から探す</b><div class="row"><input id="author" placeholder="作家名"><button id="authorBtn">検索</button></div></div><div id="authorResults"></div></section>
<section id="calendar"><div class="card"><b>🗓 発売予定</b><button id="ics" style="width:100%;margin-top:10px">iPhoneカレンダー用ICSを書き出す</button></div><div id="events"></div></section></main>
<nav><button data-s="shelf">📚 本棚</button><button data-s="search">🔎 検索</button><button data-s="authors">✍️ 作家</button><button data-s="calendar">🗓 カレンダー</button></nav>
<div id="scanner"><button id="closeScan">閉じる</button><video id="video" playsinline muted></video><p id="scanStatus">カメラを起動しています…</p></div>
<script>
const $=id=>document.getElementById(id),KEY="books_v3";let books=JSON.parse(localStorage.getItem(KEY)||"[]"),stream=null,timer=null;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){return String(s||"").normalize("NFKC").replace(/[\s‐‑‒–—−-]/g,"").toUpperCase()}
function valid13(s){if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<13;i++)n+=+s[i]*(i%2?3:1);return n%10===0}
function valid10(s){if(!/^\d{9}[\dX]$/.test(s))return false;let n=0;for(let i=0;i<10;i++)n+=(s[i]=="X"?10:+s[i])*(10-i);return n%11===0}
function to13(s){let c="978"+s.slice(0,9),n=0;for(let i=0;i<12;i++)n+=+c[i]*(i%2?3:1);return c+((10-n%10)%10)}
async function getJSON(u){let r=await fetch(u);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function gbook(v,hint=""){let x=v.volumeInfo||{},ids=x.industryIdentifiers||[];let i=(ids.find(a=>a.type==="ISBN_13")||ids.find(a=>a.type==="ISBN_10")||{}).identifier||hint;return {isbn:i,title:x.title||"",subtitle:x.subtitle||"",author:(x.authors||[]).join(" / "),publisher:x.publisher||"",date:x.publishedDate||"",cover:x.imageLinks?.thumbnail||"",upcoming:[]}}
async function openbd(isbn){try{let a=await getJSON("https://api.openbd.jp/v1/get?isbn="+isbn),x=a?.[0],s=x?.summary||{};return x?{isbn:s.isbn||isbn,title:s.title||"",author:s.author||"",publisher:s.publisher||"",date:s.pubdate||"",cover:s.cover||"",upcoming:[]}:null}catch(e){return null}}
async function isbnLookup(isbn){let b=await openbd(isbn);if(b?.title)return b;let a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent("isbn:"+isbn)+"&maxResults=20&country=JP")).items||[];let exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;if(a[0])return gbook(a[0],isbn);a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent('"'+isbn+'"')+"&maxResults=20&country=JP")).items||[];exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;throw Error("このISBNに一致する書誌情報が見つかりませんでした。")}
function card(b,add=true){return `<div class="card"><div class="book">${b.cover?`<img class="cover" src="${esc(b.cover)}">`:"<div class='cover'></div>"}<div><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div><div class="muted">${esc(b.publisher)} ${esc(b.date)}</div><div class="muted">ISBN ${esc(b.isbn||"")}</div>${add?`<button onclick='addBook(${JSON.stringify(b).replaceAll("'","&#39;")})'>蔵書に登録</button>`:""}</div></div></div>`}
window.addBook=b=>{if(!books.some(x=>norm(x.isbn)==norm(b.isbn))){books.push(b);localStorage.setItem(KEY,JSON.stringify(books));render();alert("登録しました")}else alert("すでに登録されています")}
async function searchGoogle(q){return (await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=40&country=JP&langRestrict=ja")).items||[]}
$("isbnSearch").onclick=async()=>{let s=norm($("isbn").value);if(valid10(s))s=to13(s);if(!valid13(s)){ $("addResults").innerHTML='<div class="error">ISBN-10またはISBN-13を入力してください。ハイフン・空白・全角数字は使用できます。</div>';return}$("addResults").innerHTML="検索中…";try{$("addResults").innerHTML=card(await isbnLookup(s))}catch(e){$("addResults").innerHTML='<div class="error">'+esc(e.message)+'<br>作品名＋巻数検索も試してください。</div>'}}
$("workSearch").onclick=async()=>{let q=$("work").value.trim();if(!q)return;$("addResults").innerHTML="検索中…";try{$("addResults").innerHTML=(await searchGoogle("intitle:"+q+" "+$("vol").value)).slice(0,15).map(gbook).map(card).join("")||"候補なし"}catch(e){$("addResults").innerHTML=esc(e.message)}}
$("searchBtn").onclick=async()=>{$("searchResults").innerHTML="検索中…";try{$("searchResults").innerHTML=(await searchGoogle($("query").value)).map(gbook).map(card).join("")||"結果なし"}catch(e){$("searchResults").innerHTML=esc(e.message)}}
$("authorBtn").onclick=async()=>{$("authorResults").innerHTML="検索中…";try{$("authorResults").innerHTML=(await searchGoogle("inauthor:"+$("author").value)).map(gbook).map(card).join("")||"結果なし"}catch(e){$("authorResults").innerHTML=esc(e.message)}}
function render(){$("myBooks").innerHTML=books.length?books.map(b=>card(b,false)).join(""):"<p class='muted'>蔵書はありません。</p>"}render();
async function scan(){if(!navigator.mediaDevices?.getUserMedia){alert("カメラAPIが利用できません。SafariのHTTPSページで開いてください。");return}$("scanner").style.display="block";try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("video").srcObject=stream;await $("video").play();if("BarcodeDetector" in window){let d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});timer=setInterval(async()=>{try{let c=(await d.detect($("video")))[0];if(c?.rawValue){$("isbn").value=c.rawValue;stop();$("isbnSearch").click()}}catch(e){}},500)}else $("scanStatus").textContent="カメラは起動しました。このSafariでは自動読取に非対応です。ISBNを手入力してください。"}catch(e){$("scanStatus").innerHTML="カメラを起動できませんでした。Safariのサイト設定でカメラを許可してください。<br>"+esc(e.name)}}
function stop(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("scanner").style.display="none"}
$("scan").onclick=scan;$("closeScan").onclick=stop;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(b.dataset.s).classList.add("active")});
$("ics").onclick=()=>{let l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BookShelf//JP//"];l.push("END:VCALENDAR");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([l.join("\r\n")],{type:"text/calendar"}));a.download="book-release.ics";a.click()}
</script></body></html>
