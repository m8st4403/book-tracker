<script>
const $=id=>document.getElementById(id),KEY="books_v41";let books=JSON.parse(localStorage.getItem(KEY)||"[]"),stream=null,timer=null;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){return String(s||"").normalize("NFKC").replace(/[\s‐‑‒–—−-]/g,"").toUpperCase()}
function valid13(s){if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<13;i++)n+=+s[i]*(i%2?3:1);return n%10===0}
function valid10(s){if(!/^\d{9}[\dX]$/.test(s))return false;let n=0;for(let i=0;i<10;i++)n+=(s[i]=="X"?10:+s[i])*(10-i);return n%11===0}
function to13(s){let c="978"+s.slice(0,9),n=0;for(let i=0;i<12;i++)n+=+c[i]*(i%2?3:1);return c+((10-n%10)%10)}
const apiCache=new Map(),lastRequest={time:0};
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function getJSON(u,opts={}){
 if(apiCache.has(u))return apiCache.get(u);
 let err;
 for(let n=0;n<4;n++){
  try{
   let wait=Math.max(0,700-(Date.now()-lastRequest.time)); if(wait)await sleep(wait);
   lastRequest.time=Date.now();
   let r=await fetch(u,{...opts,cache:"no-store"});
   if(r.ok){let d=await r.json();apiCache.set(u,d);return d}
   if(r.status===429){err=Error("HTTP 429");await sleep(1000*Math.pow(2,n)+Math.random()*600);continue}
   throw Error("HTTP "+r.status);
  }catch(e){err=e;if(n<3)await sleep(700*Math.pow(2,n)+Math.random()*400)}
 }
 throw err||Error("通信エラー");
}
function gbook(v,hint=""){let x=v.volumeInfo||{},ids=x.industryIdentifiers||[];let i=(ids.find(a=>a.type==="ISBN_13")||ids.find(a=>a.type==="ISBN_10")||{}).identifier||hint;return {isbn:i,title:x.title||"",subtitle:x.subtitle||"",author:(x.authors||[]).join(" / "),publisher:x.publisher||"",date:x.publishedDate||"",cover:x.imageLinks?.thumbnail||"",upcoming:[]}}
async function openbd(isbn){try{let a=await getJSON("https://api.openbd.jp/v1/get?isbn="+isbn),x=a?.[0],s=x?.summary||{};return x?{isbn:s.isbn||isbn,title:s.title||"",author:s.author||"",publisher:s.publisher||"",date:s.pubdate||"",cover:s.cover||"",upcoming:[]}:null}catch(e){return null}}
async function isbnLookup(isbn){let b=await openbd(isbn);if(b?.title)return b;let a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent("isbn:"+isbn)+"&maxResults=20&country=JP")).items||[];let exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;if(a[0])return gbook(a[0],isbn);a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent('"'+isbn+'"')+"&maxResults=20&country=JP")).items||[];exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;throw Error("このISBNに一致する書誌情報が見つかりませんでした。")}
async function searchGoogle(q){let a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=40&country=JP&langRestrict=ja")).items||[];let z=q.toLowerCase();return a.sort((x,y)=>{let xt=(x.volumeInfo?.title||"").toLowerCase(),yt=(y.volumeInfo?.title||"").toLowerCase();return (xt.includes(z)?0:1)-(yt.includes(z)?0:1)})}
function releaseTime(b){const t=Date.parse(b.date||"");return Number.isNaN(t)?0:t}
function volumeNo(b){const m=(b.title||"").match(/(?:第\s*)?(\d+)\s*(?:巻|集)/i);return m?parseInt(m[1],10):0}
function sortBooks(a,mode){return [...a].sort((x,y)=>mode==="release-desc"?releaseTime(y)-releaseTime(x):mode==="release-asc"?releaseTime(x)-releaseTime(y):mode==="volume-desc"?volumeNo(y)-volumeNo(x):volumeNo(x)-volumeNo(y))}
const sortState={};
function renderSelectableResults(id,arr){
 window[id+"Data"]=arr;
 $(id).innerHTML=(arr.length?`<div class="selectbar"><label><input class="check selectAll"> 全選択</label><button onclick="bulkAdd('${id}')">選択した本を一括登録</button><button onclick="cycleSort('${id}')">↕ 並べ替え</button></div>`:"")+arr.map((x,i)=>card(x,true,"result",i)).join("")||"結果なし";
 $(id).querySelector(".selectAll")?.addEventListener("change",e=>$(id).querySelectorAll(".selectBook").forEach(x=>x.checked=e.target.checked));
}
function cycleSort(id){const modes=["release-desc","release-asc","volume-desc","volume-asc"];sortState[id]=((sortState[id]??0)+1)%4;renderSelectableResults(id,sortBooks(window[id+"Data"]||[],modes[sortState[id]]))}
function card(book,add=true,mode="result",index=-1){
 let safe=JSON.stringify(book).replace(/</g,"\\u003c").replace(/'/g,"&#39;");
 let chk=`<input class="check selectBook" type="checkbox" data-index="${index}" aria-label="選択">`;
 return `<div class="card"><div class="selectline">${chk}<div class="content"><div class="book">${book.cover?`<img class="cover" src="${esc(book.cover)}">`:"<div class='cover'></div>"}<div><div class="title">${esc(book.title)}</div><div class="muted">${esc(book.author)}</div><div class="muted">${esc(book.publisher)} ${esc(book.date)}</div><div class="muted">ISBN ${esc(book.isbn||"")}</div>${add?`<div class="actions"><button onclick='addBook(${safe})'>蔵書に登録</button></div>`:""}</div></div></div></div></div>`;
}
window.addBook=b=>{if(!books.some(x=>norm(x.isbn)==norm(b.isbn))){books.push(b);localStorage.setItem(KEY,JSON.stringify(books));render();alert("登録しました")}else alert("すでに登録されています")}
$("isbnSearch").onclick=async()=>{let s=norm($("isbn").value);if(valid10(s))s=to13(s);if(!valid13(s)){$("addResults").innerHTML='<div class="error">ISBN-10またはISBN-13を入力してください。</div>';return}$("addResults").innerHTML="検索中…";try{let one=await isbnLookup(s);window.addResultsData=[one];$("addResults").innerHTML='<div class="selectbar"><label><input class="check selectAll"> 選択</label><button onclick="bulkAdd(\'addResults\')">一括登録</button></div>'+card(one,true,"result",0);$("addResults").querySelector(".selectAll").onchange=e=>$("addResults").querySelector(".selectBook").checked=e.target.checked}catch(e){$("addResults").innerHTML='<div class="error">'+esc(e.message)+'<br>作品名＋巻数検索も試してください。</div>'}}
function renderResults(id,items){
 let arr=items.map(gbook); window[id+"Data"]=arr;
 $(id).innerHTML=(arr.length?`<div class="selectbar"><label><input class="check selectAll" data-target="${id}"> 全選択</label><button onclick="bulkAdd('${id}')">選択した本を一括登録</button></div>`:"")+arr.map((x,i)=>card(x,true,"result",i)).join("")||"結果なし";
 $(id).querySelector(".selectAll")?.addEventListener("change",e=>$(id).querySelectorAll(".selectBook").forEach(x=>x.checked=e.target.checked));
}
window.bulkAdd=id=>{let arr=window[id+"Data"]||[];let ids=[...$(id).querySelectorAll(".selectBook:checked")].map(x=>+x.dataset.index);if(!ids.length){alert("登録する本を選択してください");return}let n=0;ids.map(i=>arr[i]).filter(Boolean).forEach(x=>{if(!books.some(b=>norm(b.isbn)==norm(x.isbn))){books.push(x);n++}});localStorage.setItem(KEY,JSON.stringify(books));render();alert(n+"冊を登録しました（重複は除外）")};
$("workSearch").onclick=async()=>{let q=$("work").value.trim(),v=$("vol").value.trim();if(!q)return;$("addResults").innerHTML="検索中…";try{let arr=(await searchGoogle("intitle:"+q+(v?" "+v:""))).map(gbook);arr=arr.filter((x,i,a)=>i===a.findIndex(y=>norm(y.isbn)===norm(x.isbn)&&norm(x.isbn)));if(!v)arr=sortBooks(arr,"release-desc");renderSelectableResults("addResults",arr)}catch(e){$("addResults").innerHTML=esc(e.message)}};
$("searchBtn").onclick=async()=>{let q=$("query").value.trim();if(!q)return;$("searchResults").innerHTML="検索中…";try{renderResults("searchResults",await searchGoogle(q))}catch(e){$("searchResults").innerHTML=esc(e.message)}};
$("authorBtn").onclick=async()=>{let q=$("author").value.trim();if(!q)return;$("authorResults").innerHTML="検索中…";try{renderResults("authorResults",await searchGoogle("inauthor:"+q))}catch(e){$("authorResults").innerHTML=esc(e.message)}}
let calDate=new Date();calDate.setDate(1);let selectedDate=null;
function allEvents(){let a=[];books.forEach(b=>(b.upcoming||[]).forEach(e=>a.push({...e,base:b.title,source:"蔵書・作家連動"})));return a}
function renderLibrary(){
 let q=($("libraryFilter").value||"").toLowerCase();
 let a=books.map((b,i)=>({b,i})).filter(x=>!q||[x.b.title,x.b.author,x.b.isbn,x.b.publisher].join(" ").toLowerCase().includes(q));
 $("myBooks").innerHTML=a.length?`<div class="selectbar"><label><input id="libAll" class="check"> 全選択</label><button id="deleteSelected">選択した本を削除</button></div>`+a.map(x=>card(x.b,false,"library",x.i)).join(""):"<p class='muted'>該当する蔵書はありません。</p>";
 $("libAll")?.addEventListener("change",e=>document.querySelectorAll("#myBooks .selectBook").forEach(x=>x.checked=e.target.checked));
 $("deleteSelected")?.addEventListener("click",()=>{let ids=[...document.querySelectorAll("#myBooks .selectBook:checked")].map(x=>+x.dataset.index).sort((a,b)=>b-a);if(!ids.length){alert("削除する本を選択してください");return}if(!confirm(ids.length+"冊を削除しますか？"))return;ids.forEach(i=>books.splice(i,1));localStorage.setItem(KEY,JSON.stringify(books));render()});
}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),by={};allEvents().forEach(e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.date))(by[e.date]??=[]).push(e)});$("monthTitle").textContent=y+"年"+(m+1)+"月";let s="",first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)s+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),es=by[k]||[];s+=`<div class="day ${k===new Date().toISOString().slice(0,10)?"today ":""}${k===selectedDate?"selected":""}"><button onclick="selectDay('${k}')"><b>${d}</b><br>${es.slice(0,5).map(e=>'<span class="dot"></span>').join("")}</button></div>`}$("calendarGrid").innerHTML=s;if(selectedDate)showDay(selectedDate)}
window.selectDay=k=>{selectedDate=k;renderCalendar();showDay(k)}
function showDay(k){let a=allEvents().filter(e=>e.date===k);$("selectedDateTitle").textContent=k+" の発売予定";$("selectedEvents").innerHTML=a.length?a.map(e=>`<div class="event"><div class="release">${esc(e.title)}</div><div class="muted">${esc(e.author||"")}</div><div class="muted">ISBN ${esc(e.isbn||"")}</div><div class="muted">📚 ${esc(e.source)}</div></div>`).join(""):"<p class='muted'>この日の発売予定はありません。</p>"}
function render(){renderLibrary();renderCalendar();updateClearButtons()}
function updateClearButtons(){document.querySelectorAll(".clearbtn").forEach(b=>{let i=$(b.dataset.clear);b.style.display=i&&i.value?"block":"none"})}
document.querySelectorAll(".clearbtn").forEach(b=>b.onclick=()=>{$(b.dataset.clear).value="";$(b.dataset.clear).dispatchEvent(new Event("input",{bubbles:true}));updateClearButtons()});
$("libraryFilter").oninput=renderLibrary;$("prevMonth").onclick=()=>{calDate.setMonth(calDate.getMonth()-1);selectedDate=null;renderCalendar()};$("nextMonth").onclick=()=>{calDate.setMonth(calDate.getMonth()+1);selectedDate=null;renderCalendar()};
document.querySelectorAll("#bottomNav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(b.dataset.s).classList.add("active");document.querySelectorAll("#bottomNav button").forEach(x=>x.classList.toggle("active",x===b))});
$("ics").onclick=()=>{let l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BookShelf//JP//"];allEvents().forEach((e,i)=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.date))l.push("BEGIN:VEVENT","UID:"+i+"@bookshelf","DTSTART:"+e.date.replaceAll("-","")+"T090000","SUMMARY:"+e.title+" 発売予定","DESCRIPTION:"+e.base+" / "+(e.isbn||""),"END:VEVENT")});l.push("END:VCALENDAR");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([l.join("\r\n")],{type:"text/calendar"}));a.download="book-release.ics";a.click()};
async function scan(){if(!navigator.mediaDevices?.getUserMedia){alert("HTTPSのSafariで開いてください。");return}$("scanner").style.display="block";try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("video").srcObject=stream;await $("video").play();if("BarcodeDetector" in window){let d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});timer=setInterval(async()=>{try{let c=(await d.detect($("video")))[0];if(c?.rawValue){$("isbn").value=c.rawValue;stopScan();$("isbnSearch").click()}}catch(e){}},500)}else $("scanStatus").textContent="カメラは起動しました。このSafariでは自動読取に非対応です。ISBNを手入力してください。"}catch(e){$("scanStatus").innerHTML="カメラを起動できませんでした。Safariのサイト設定でカメラを許可してください。"}}
function stopScan(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("scanner").style.display="none"}
$("scan").onclick=scan;$("closeScan").onclick=stopScan;
// 画面全体の左右フリック：端から端まで循環
(function(){const ids=["add","library","search","authors","calendar"];let sx=0,sy=0;
document.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.15)return;const cur=ids.findIndex(id=>$(id).classList.contains("active"));const next=(cur+(dx<0?1:-1)+ids.length)%ids.length;document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(ids[next]).classList.add("active");document.querySelectorAll("#bottomNav button").forEach(x=>x.classList.toggle("active",x.dataset.s===ids[next]));window.scrollTo({top:0,behavior:"smooth"})},{passive:true});})();
async function findSimilarWorks(){const q=($("query").value||$("work").value||"").trim();if(!q){alert("作品名を入力してください。");return}const c=[...document.querySelectorAll("#similarBox input:checked")].map(x=>x.value);if(!c.length){alert("条件を1つ以上選択してください。");return}$("similarResults").innerHTML="検索中…";try{const base=(await searchGoogle(q)).map(gbook)[0]||{};const terms=[];if(c.includes("story")||c.includes("setting")||c.includes("tone"))terms.push(q);if(c.includes("art")||c.includes("author"))terms.push(base.author||"");if(c.includes("genre"))terms.push(q);let arr=(await searchGoogle([...new Set(terms.filter(Boolean))].join(" "))).map(gbook).filter(x=>norm(x.title)!==norm(base.title));window.similarResultsData=arr;$("similarResults").innerHTML=(arr.length?`<div class="selectbar"><label><input class="check similarAll"> 全選択</label><button onclick="bulkAdd('similarResults')">選択した本を一括登録</button></div>`:"")+arr.map((x,i)=>card(x,true,"similar",i)).join("")||"候補なし";$("similarResults").querySelector(".similarAll")?.addEventListener("change",e=>$("similarResults").querySelectorAll(".selectBook").forEach(x=>x.checked=e.target.checked))}catch(e){$("similarResults").innerHTML=esc(e.message)}}$("similarBtn")?.addEventListener("click",findSimilarWorks);
render();
</script>
<script id="v44-patch-js">
(function(){
  "use strict";
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const enc=s=>encodeURIComponent(s||'');

  /* 1. 入力欄にクリアボタン。ISBNは複数入力にも対応 */
  function enhanceInputs(){
    document.querySelectorAll('input[type="text"],input[type="search"],input[type="number"],textarea').forEach(input=>{
      if(input.dataset.v44Enhanced) return;
      input.dataset.v44Enhanced="1";
      const meta=((input.placeholder||'')+' '+(input.id||'')+' '+(input.name||'')).toLowerCase();
      const isISBN=meta.includes('isbn');
      const row=document.createElement('div'); row.className='v44-input-row';
      input.parentNode.insertBefore(row,input); row.appendChild(input);
      if(isISBN) input.classList.add('v44-isbn-input');
      const clear=document.createElement('button');
      clear.type='button'; clear.className='v44-clear'; clear.textContent='×'; clear.title='入力をクリア';
      clear.onclick=()=>{input.value='';input.dispatchEvent(new Event('input',{bubbles:true}));input.focus();};
      row.appendChild(clear);

      if(isISBN){
        const hint=document.createElement('div');
        hint.className='v44-multi-isbn';
        hint.textContent='複数冊は改行・スペース・カンマ区切りで入力できます（最大30冊）';
        row.parentNode.appendChild(hint);
      }
    });
  }

  /* 2. 書籍詳細 */
  const overlay=document.createElement('div');
  overlay.className='v44-detail-overlay';
  overlay.innerHTML='<div class="v44-detail-sheet" role="dialog" aria-modal="true"><div class="v44-detail-head"><h2 id="v44d-title">書籍詳細</h2><button id="v44d-close" class="v44-clear">×</button></div><div id="v44d-body"></div></div>';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(overlay));
  function closeDetail(){overlay.style.display='none'}
  function firstISBN(book){
    const ids=book.industryIdentifiers||book.volumeInfo?.industryIdentifiers||[];
    return (ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10')||ids[0]||{}).identifier||book.isbn||'';
  }
  window.v44OpenDetail=function(book){
    const v=book.volumeInfo||book;
    const title=v.title||'書籍詳細', authors=v.authors||[], publisher=v.publisher||'';
    const isbn=firstISBN(book), img=v.imageLinks?.thumbnail||book.image||'';
    const desc=v.description||'紹介文は取得できませんでした。';
    const amazon='https://www.amazon.co.jp/s?k='+enc(isbn||title);
    const publisherSearch='https://www.google.com/search?q='+enc((publisher+' '+title).trim());
    overlay.querySelector('#v44d-title').textContent=title;
    overlay.querySelector('#v44d-body').innerHTML=
      '<div class="v44-detail-grid"><div>'+ (img?'<img class="v44-detail-cover" src="'+esc(img)+'" alt="">':'') +
      '</div><div><div><b>著者：</b>'+esc(authors.join('、'))+'</div><div><b>出版社：</b>'+esc(publisher)+'</div><div><b>発売日：</b>'+esc(v.publishedDate||'')+'</div>'+
      (isbn?'<div><b>ISBN：</b>'+esc(isbn)+'</div>':'')+'</div></div>'+
      '<div class="v44-actions">'+
      '<a class="btn" href="'+amazon+'" target="_blank" rel="noopener">Amazonで探す</a>'+
      (publisher?'<a class="btn" href="'+publisherSearch+'" target="_blank" rel="noopener">出版社を探す</a>':'')+
      '<button class="btn" type="button" id="v44-related-btn">関連書籍を検索</button></div>'+
      '<div style="margin-top:16px"><b>紹介</b><p>'+esc(desc).replace(/\n/g,'<br>')+'</p></div>'+
      '<div id="v44-related" class="v44-related"></div>';
    overlay.style.display='flex';
    overlay.querySelector('#v44d-close').onclick=closeDetail;
    overlay.querySelector('#v44-related-btn').onclick=()=>v44Related(book);
  };
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDetail()});
  window.v44Related=async function(book){
    const box=document.getElementById('v44-related'); if(!box)return;
    box.innerHTML='<h3>関連書籍</h3><p>検索中…</p>';
    const v=book.volumeInfo||book, title=v.title||'', author=(v.authors||[])[0]||'';
    const queries=[];
    if(author) queries.push('inauthor:'+author);
    if(title) queries.push(title.split(/[\s　:：]+/).slice(0,5).join(' '));
    let items=[];
    for(const q of queries){
      try{
        const r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=12&langRestrict=ja');
        const d=await r.json();
        items.push(...(d.items||[]));
      }catch(_){}
      if(items.length>=12)break;
    }
    const seen=new Set(), filtered=[];
    items.forEach(x=>{
      const t=x.volumeInfo?.title||'', id=x.id||t;
      if(!seen.has(id)&&t!==title){seen.add(id);filtered.push(x)}
    });
    if(!filtered.length){box.innerHTML='<h3>関連書籍</h3><p>関連書籍を見つけられませんでした。</p>';return}
    box.innerHTML='<h3>関連書籍</h3><div class="v44-related-list">'+filtered.slice(0,10).map((x,i)=>{
      const vv=x.volumeInfo||{}, img=vv.imageLinks?.thumbnail||'';
      return '<button type="button" class="v44-related-item" data-i="'+i+'">'+(img?'<img src="'+esc(img)+'" alt="">':'')+
        '<span><b>'+esc(vv.title||'')+'</b><br><small>'+esc((vv.authors||[]).join('、'))+'</small></span></button>';
    }).join('')+'</div>';
    box.querySelectorAll('[data-i]').forEach((el,i)=>el.onclick=()=>v44OpenDetail(filtered[i]));
  };

  /* 3. 検索結果/蔵書カードをタップすると詳細を開く */
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-book],[data-isbn],[data-book-id],[data-volume-id],.book-card,.book-item,.result-item');
    if(!el||e.target.closest('button,a,input,label,select'))return;
    let b=null;
    try{if(el.dataset.book)b=JSON.parse(el.dataset.book)}catch(_){}
    if(!b)b={title:el.dataset.title||el.querySelector('.title,h3,h4,strong')?.textContent||'',isbn:el.dataset.isbn||'',authors:(el.dataset.author||'').split(/[、,]/).filter(Boolean),publisher:el.dataset.publisher||'',publishedDate:el.dataset.published||''};
    if(b.title||b.isbn)v44OpenDetail(b);
  });

  /* 4. 複数ISBN検索ボタンを既存ISBN欄の直下へ */
  function addMultiISBN(){
    document.querySelectorAll('input.v44-isbn-input').forEach(input=>{
      if(input.dataset.v44MultiAdded)return;
      input.dataset.v44MultiAdded='1';
      const btn=document.createElement('button');
      btn.type='button'; btn.className='btn'; btn.textContent='複数ISBNを検索'; btn.style.marginTop='8px';
      input.parentNode.parentNode.appendChild(btn);
      btn.onclick=async()=>{
        const isbns=(input.value.match(/(?:97[89]\d{10}|\d{9}[\dXx])/g)||[]).map(s=>s.replace(/[^0-9Xx]/g,''));
        if(!isbns.length){alert('ISBNを入力してください');return}
        let box=input.parentNode.parentNode.querySelector('.v44-isbn-results');
        if(!box){box=document.createElement('div');box.className='v44-related-list v44-isbn-results';input.parentNode.parentNode.appendChild(box)}
        box.innerHTML='<p>検索中…</p>';
        const found=[];
        for(const isbn of isbns.slice(0,30)){
          try{
            const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)+'&maxResults=1&langRestrict=ja');
            const d=await r.json(), x=d.items?.[0];
            if(x)found.push(x);
          }catch(_){}
        }
        if(!found.length){box.innerHTML='<p>見つかりませんでした。</p>';return}
        box.innerHTML=found.map((x,i)=>{
          const v=x.volumeInfo||{}, img=v.imageLinks?.thumbnail||'';
          return '<button type="button" class="v44-related-item" data-m="'+i+'">'+(img?'<img src="'+esc(img)+'" alt="">':'')+
            '<span><b>'+esc(v.title||'')+'</b><br><small>'+esc((v.authors||[]).join('、'))+'</small></span></button>';
        }).join('');
        box.querySelectorAll('[data-m]').forEach((el,i)=>el.onclick=()=>v44OpenDetail(found[i]));
      };
    });
  }

  /* 5. フリックは画面下半分だけ。カレンダー内は月移動 */
  let sx=0,sy=0,active=false,startEl=null;
  function calHit(el){return !!el?.closest?.('#calendar,.calendar,.calendar-grid,.calendar-container,[data-calendar]')}
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0]; if(!t)return;
    if(t.clientY<innerHeight*0.5){active=false;return}
    active=true;sx=t.clientX;sy=t.clientY;startEl=e.target;
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const t=e.changedTouches[0]; if(!t)return;
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.2)return;
    if(calHit(startEl)||calHit(e.target)){
      if(typeof window.changeMonth==='function')window.changeMonth(dx<0?1:-1);
      else if(dx<0&&typeof window.nextMonth==='function')window.nextMonth();
      else if(dx>0&&typeof window.prevMonth==='function')window.prevMonth();
      else document.dispatchEvent(new CustomEvent('v44CalendarSwipe',{detail:{direction:dx<0?'next':'prev'}}));
      return;
    }
    document.dispatchEvent(new CustomEvent('v44TabSwipe',{detail:{direction:dx<0?'next':'prev'} }));
  },{passive:true});

  document.addEventListener('DOMContentLoaded',()=>{enhanceInputs();addMultiISBN();});
  const mo=new MutationObserver(()=>{enhanceInputs();addMultiISBN()});
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
