<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>本棚スケジュール v4.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding-bottom:72px}header{background:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}main{max-width:800px;margin:auto;padding:12px;touch-action:pan-y}section{display:none}section.active{display:block}.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 1px 3px #0001}.muted{font-size:13px;color:#6b7280}.row{display:flex;gap:8px}.row>*{flex:1}input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font:inherit}button{font:inherit;padding:11px 13px;border:0;border-radius:11px;background:#111827;color:white;font-weight:700}.secondary{background:#e5e7eb;color:#111827}.clearwrap{position:relative}.clearwrap input{padding-right:42px}.clearbtn{position:absolute;right:5px;top:5px;width:34px;height:34px;padding:0;border-radius:50%;background:#e5e7eb;color:#555;display:none}.book{display:flex;gap:12px}.cover{width:62px;height:88px;object-fit:cover;border-radius:8px;background:#eee}.title{font-weight:800;font-size:16px}.actions{margin-top:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}nav button{flex:1;background:#fff;color:#666;border-radius:0;font-size:11px;padding:10px 3px}nav button.active{color:#111;font-weight:800}.monthbar{display:flex;align-items:center;justify-content:space-between}.monthbar button{min-width:42px}.calhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#777;font-size:11px;margin-top:12px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:5px}.day{min-height:58px;background:#f8f8fa;border:1px solid #eee;border-radius:8px;padding:4px}.day.empty{background:transparent;border:0}.day button{background:transparent;color:#111;padding:0;width:100%;height:100%;text-align:left}.today{border:2px solid #111}.selected{box-shadow:inset 0 0 0 2px #777}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#111;margin:3px 2px}.event{padding:10px 0;border-top:1px solid #eee}.release{font-weight:800}.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px}.ok{background:#ecfdf5;color:#166534;padding:10px;border-radius:10px}#scanner{display:none;position:fixed;inset:0;background:#000;color:white;z-index:20;padding:16px}#video{width:100%;height:70%;object-fit:cover;margin-top:35px;border-radius:16px}
</style></head><body>
<header><b>📚 本棚スケジュール v4.1</b><div class="muted">フリック対応・検索改善版</div></header>
<main id="content">
<section id="add" class="active"><div class="card"><b>➕ 本を追加</b><p class="muted">ISBN-10/13、ハイフン、全角数字に対応。</p>
<div class="row"><div class="clearwrap"><input id="isbn" inputmode="numeric" placeholder="978-4-09-861040-3"><button class="clearbtn" data-clear="isbn">×</button></div><button id="scan">📷 スキャン</button></div><button id="isbnSearch" style="width:100%;margin-top:8px">ISBNで検索</button>
<hr><div class="row"><div class="clearwrap"><input id="work" placeholder="作品タイトル"><button class="clearbtn" data-clear="work">×</button></div><div class="clearwrap"><input id="vol" inputmode="numeric" placeholder="巻数"><button class="clearbtn" data-clear="vol">×</button></div></div><button id="workSearch" style="width:100%;margin-top:8px">作品＋巻数から検索</button><div id="addResults"></div></div></section>
<section id="library"><div class="card"><b>📚 蔵書</b><p class="muted">作品名・作家名・ISBNで部分一致検索。</p><div class="clearwrap"><input id="libraryFilter" placeholder="作品名 / 作家名 / ISBN"><button class="clearbtn" data-clear="libraryFilter">×</button></div><div id="myBooks"></div></div></section>
<section id="search"><div class="card"><b>🔎 書籍検索</b><div class="row"><div class="clearwrap"><input id="query" placeholder="作品名 / ISBN / 作家名"><button class="clearbtn" data-clear="query">×</button></div><button id="searchBtn">検索</button></div></div><div id="searchResults"></div></section>
<section id="authors"><div class="card"><b>✍️ 作家検索</b><div class="row"><div class="clearwrap"><input id="author" placeholder="作家名"><button class="clearbtn" data-clear="author">×</button></div><button id="authorBtn">検索</button></div></div><div id="authorResults"></div></section>
<section id="calendar"><div class="card"><div class="monthbar"><button id="prevMonth" class="secondary">‹</button><b id="monthTitle"></b><button id="nextMonth" class="secondary">›</button></div><p class="muted">● 蔵書・作家連動の発売予定</p><div class="calhead"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendarGrid" class="calgrid"></div><button id="ics" style="width:100%;margin-top:12px">iPhoneカレンダー用ICS</button></div><div class="card"><b id="selectedDateTitle">日付を選択してください</b><div id="selectedEvents" class="muted" style="margin-top:8px">カレンダーの日をタップしてください。</div></div></section>
</main>
<nav id="bottomNav"><button data-s="add" class="active">➕<br>追加</button><button data-s="library">📚<br>蔵書</button><button data-s="search">🔎<br>検索</button><button data-s="authors">✍️<br>作家</button><button data-s="calendar">🗓<br>カレンダー</button></nav>
<div id="scanner"><button id="closeScan" class="secondary">閉じる</button><video id="video" playsinline muted></video><p id="scanStatus">カメラを起動しています…</p></div>
<script>
const $=id=>document.getElementById(id),KEY="books_v41";let books=JSON.parse(localStorage.getItem(KEY)||"[]"),stream=null,timer=null;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function norm(s){return String(s||"").normalize("NFKC").replace(/[\s‐‑‒–—−-]/g,"").toUpperCase()}
function valid13(s){if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<13;i++)n+=+s[i]*(i%2?3:1);return n%10===0}
function valid10(s){if(!/^\d{9}[\dX]$/.test(s))return false;let n=0;for(let i=0;i<10;i++)n+=(s[i]=="X"?10:+s[i])*(10-i);return n%11===0}
function to13(s){let c="978"+s.slice(0,9),n=0;for(let i=0;i<12;i++)n+=+c[i]*(i%2?3:1);return c+((10-n%10)%10)}
async function getJSON(u){let r=await fetch(u);if(!r.ok)throw Error("HTTP "+r.status);return r.json()}
function gbook(v,hint=""){let x=v.volumeInfo||{},ids=x.industryIdentifiers||[];let i=(ids.find(a=>a.type==="ISBN_13")||ids.find(a=>a.type==="ISBN_10")||{}).identifier||hint;return {isbn:i,title:x.title||"",subtitle:x.subtitle||"",author:(x.authors||[]).join(" / "),publisher:x.publisher||"",date:x.publishedDate||"",cover:x.imageLinks?.thumbnail||"",upcoming:[]}}
async function openbd(isbn){try{let a=await getJSON("https://api.openbd.jp/v1/get?isbn="+isbn),x=a?.[0],s=x?.summary||{};return x?{isbn:s.isbn||isbn,title:s.title||"",author:s.author||"",publisher:s.publisher||"",date:s.pubdate||"",cover:s.cover||"",upcoming:[]}:null}catch(e){return null}}
async function isbnLookup(isbn){let b=await openbd(isbn);if(b?.title)return b;let a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent("isbn:"+isbn)+"&maxResults=20&country=JP")).items||[];let exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;if(a[0])return gbook(a[0],isbn);a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent('"'+isbn+'"')+"&maxResults=20&country=JP")).items||[];exact=a.map(x=>gbook(x)).find(x=>norm(x.isbn)==isbn);if(exact?.title)return exact;throw Error("このISBNに一致する書誌情報が見つかりませんでした。")}
async function searchGoogle(q){let a=(await getJSON("https://www.googleapis.com/books/v1/volumes?q="+encodeURIComponent(q)+"&maxResults=40&country=JP&langRestrict=ja")).items||[];let z=q.toLowerCase();return a.sort((x,y)=>{let xt=(x.volumeInfo?.title||"").toLowerCase(),yt=(y.volumeInfo?.title||"").toLowerCase();return (xt.includes(z)?0:1)-(yt.includes(z)?0:1)})}
function card(b,add=true){return `<div class="card"><div class="book">${b.cover?`<img class="cover" src="${esc(b.cover)}">`:"<div class='cover'></div>"}<div><div class="title">${esc(b.title)}</div><div class="muted">${esc(b.author)}</div><div class="muted">${esc(b.publisher)} ${esc(b.date)}</div><div class="muted">ISBN ${esc(b.isbn||"")}</div>${add?`<div class="actions"><button onclick='addBook(${JSON.stringify(b).replaceAll("'","&#39;")})'>蔵書に登録</button></div>`:""}</div></div></div>`}
window.addBook=b=>{if(!books.some(x=>norm(x.isbn)==norm(b.isbn))){books.push(b);localStorage.setItem(KEY,JSON.stringify(books));render();alert("登録しました")}else alert("すでに登録されています")}
$("isbnSearch").onclick=async()=>{let s=norm($("isbn").value);if(valid10(s))s=to13(s);if(!valid13(s)){$("addResults").innerHTML='<div class="error">ISBN-10またはISBN-13を入力してください。</div>';return}$("addResults").innerHTML="検索中…";try{$("addResults").innerHTML=card(await isbnLookup(s))}catch(e){$("addResults").innerHTML='<div class="error">'+esc(e.message)+'<br>作品名＋巻数検索も試してください。</div>'}}
$("workSearch").onclick=async()=>{let q=$("work").value.trim();if(!q)return;$("addResults").innerHTML="検索中…";try{$("addResults").innerHTML=(await searchGoogle("intitle:"+q+" "+$("vol").value)).slice(0,15).map(gbook).map(card).join("")||"候補なし"}catch(e){$("addResults").innerHTML=esc(e.message)}}
$("searchBtn").onclick=async()=>{let q=$("query").value.trim();if(!q)return;$("searchResults").innerHTML="検索中…";try{$("searchResults").innerHTML=(await searchGoogle(q)).map(gbook).map(card).join("")||"結果なし"}catch(e){$("searchResults").innerHTML=esc(e.message)}}
$("authorBtn").onclick=async()=>{let q=$("author").value.trim();if(!q)return;$("authorResults").innerHTML="検索中…";try{$("authorResults").innerHTML=(await searchGoogle("inauthor:"+q)).map(gbook).map(card).join("")||"結果なし"}catch(e){$("authorResults").innerHTML=esc(e.message)}}
let calDate=new Date();calDate.setDate(1);let selectedDate=null;
function allEvents(){let a=[];books.forEach(b=>(b.upcoming||[]).forEach(e=>a.push({...e,base:b.title,source:"蔵書・作家連動"})));return a}
function renderLibrary(){let q=($("libraryFilter").value||"").toLowerCase();let a=books.filter(b=>!q||[b.title,b.author,b.isbn,b.publisher].join(" ").toLowerCase().includes(q));$("myBooks").innerHTML=a.length?a.map(b=>card(b,false)).join(""):"<p class='muted'>該当する蔵書はありません。</p>"}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth(),by={};allEvents().forEach(e=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.date))(by[e.date]??=[]).push(e)});$("monthTitle").textContent=y+"年"+(m+1)+"月";let s="",first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)s+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),es=by[k]||[];s+=`<div class="day ${k===new Date().toISOString().slice(0,10)?"today ":""}${k===selectedDate?"selected":""}"><button onclick="selectDay('${k}')"><b>${d}</b><br>${es.slice(0,5).map(e=>'<span class="dot"></span>').join("")}</button></div>`}$("calendarGrid").innerHTML=s;if(selectedDate)showDay(selectedDate)}
window.selectDay=k=>{selectedDate=k;renderCalendar();showDay(k)}
function showDay(k){let a=allEvents().filter(e=>e.date===k);$("selectedDateTitle").textContent=k+" の発売予定";$("selectedEvents").innerHTML=a.length?a.map(e=>`<div class="event"><div class="release">${esc(e.title)}</div><div class="muted">${esc(e.author||"")}</div><div class="muted">ISBN ${esc(e.isbn||"")}</div><div class="muted">📚 ${esc(e.source)}</div></div>`).join(""):"<p class='muted'>この日の発売予定はありません。</p>"}
function render(){renderLibrary();renderCalendar();updateClearButtons()}
function updateClearButtons(){document.querySelectorAll(".clearbtn").forEach(b=>{let i=$(b.dataset.clear);b.style.display=i&&i.value?"block":"none"})}
document.querySelectorAll(".clearbtn").forEach(b=>b.onclick=()=>{$(b.dataset.clear).value="";$(b.dataset.clear).dispatchEvent(new Event("input",{bubbles:true}));updateClearButtons()});
$("libraryFilter").oninput=renderLibrary;$("prevMonth").onclick=()=>{calDate.setMonth(calDate.getMonth()-1);selectedDate=null;renderCalendar()};$("nextMonth").onclick=()=>{calDate.setMonth(calDate.getMonth()+1);selectedDate=null;renderCalendar()};
document.querySelectorAll("#bottomNav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(b.dataset.s).classList.add("active");document.querySelectorAll("#bottomNav button").forEach(x=>x.classList.toggle("active",x===b))});
$("ics").onclick=()=>{let l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BookShelf//JP//"];allEvents().forEach((e,i)=>{if(/^\d{4}-\d{2}-\d{2}$/.test(e.date))l.push("BEGIN:VEVENT","UID:"+i+"@bookshelf","DTSTART:"+e.date.replaceAll("-","")+"T090000","SUMMARY:"+e.title+" 発売予定","DESCRIPTION:"+e.base+" / "+(e.isbn||""),"END:VEVENT")});l.push("END:VCALENDAR");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([l.join("\r\n")],{type:"text/calendar"}));a.download="book-release.ics";a.click()};
async function scan(){if(!navigator.mediaDevices?.getUserMedia){alert("HTTPSのSafariで開いてください。");return}$("scanner").style.display="block";try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("video").srcObject=stream;await $("video").play();if("BarcodeDetector" in window){let d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});timer=setInterval(async()=>{try{let c=(await d.detect($("video")))[0];if(c?.rawValue){$("isbn").value=c.rawValue;stopScan();$("isbnSearch").click()}}catch(e){}},500)}else $("scanStatus").textContent="カメラは起動しました。このSafariでは自動読取に非対応です。ISBNを手入力してください。"}catch(e){$("scanStatus").innerHTML="カメラを起動できませんでした。Safariのサイト設定でカメラを許可してください。"}}
function stopScan(){if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("scanner").style.display="none"}
$("scan").onclick=scan;$("closeScan").onclick=stopScan;
// iPhoneフリックでタブ切替
let sx=0,sy=0;document.querySelector("main").addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.querySelector("main").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.3){let ids=["add","library","search","authors","calendar"],cur=ids.findIndex(id=>$(id).classList.contains("active")),next=Math.max(0,Math.min(ids.length-1,cur+(dx<0?1:-1)));if(next!==cur){document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));$(ids[next]).classList.add("active");document.querySelectorAll("#bottomNav button").forEach(b=>b.classList.toggle("active",b.dataset.s===ids[next]))}}},{passive:true});
render();
</script></body></html>
